name: Prodigy Software
description: Prodigy Software was a San Francisco-based provider of cloud-based automotive retail
  software, offering a SaaS digital-retailing platform that let car dealerships move the sales
  process online (web-store services, deal structuring, and financing workflows). Founded in 2015
  by Marty Hu and Michia Rohrssen, it raised seed funding from Battery Ventures, SV Angel, 8VC, and
  CrunchFund, and was acquired by Upstart Holdings in March 2021. The company no longer operates
  independently and publishes no public API, developer portal, or SDKs; its former domain is parked.
